name: Check Florida R-06 research return
on:
  push:
    branches:
      - research/florida-r06-20261019
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/florida-r06-20261019
          persist-credentials: true
      - name: Validate Florida research packet with Python
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_state_return.py research/returns/R-06-FL --state FL --name Florida --counties 67 | tee /tmp/florida-check-output.txt
      - name: Preserve checker output in research notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("research/returns/R-06-FL/notes.md")
          content = path.read_text()
          text = Path("/tmp/florida-check-output.txt").read_text()
          marker = "## Self-check output"
          prefix = content.split(marker, 1)[0]
          path.write_text(prefix + marker + "\n\n\x60\x60\x60text\n" + text.rstrip() + "\n\x60\x60\x60\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/returns/R-06-FL/notes.md
          git diff --cached --quiet || (git commit -m "research(FL): record Python return-check output" && git push origin HEAD:research/florida-r06-20261019)
