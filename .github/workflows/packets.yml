name: Rebuild printable packets
# The printable packets' print views (flyers/packets/**/*.html) are regenerated by scripts/build_public.py
# whenever guide data changes. This workflow renders the matching PDFs, so the paper packets follow the data
# without anyone needing Chrome locally. Only packets whose print view changed are rendered again.
on:
  push:
    branches: [main]
    paths:
      - 'flyers/packets/**.html'
      - 'flyers/packets/packets.css'
      - 'scripts/build_packets.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: packets
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install renderer
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Render changed packets
        run: node scripts/build_packets.cjs
      - name: Commit the PDFs
        run: |
          git add flyers/packets data/packets/rendered.json
          if git diff --cached --quiet; then
            echo "Packet PDFs already match their print views."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild printable packet PDFs"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
            git pull --rebase origin main
          done
          exit 1
