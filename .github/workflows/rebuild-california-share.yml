name: Regenerate all California share pages
on:
  push:
    branches:
      - publish/california-referral-20261019
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: publish/california-referral-20261019
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and commit all generated public HTML
        run: |
          python3 -m pip install qrcode
          python3 scripts/build_public.py
          python3 scripts/make_qr.py
          python3 scripts/build_public.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- '*.html' assets/ data/public/
          git diff --cached --quiet || (git commit -m "publish(CA): synchronize state sharing pages and generated assets" && git push origin HEAD:publish/california-referral-20261019)
