name: Check California R-06 research return
on:
  push:
    branches:
      - research/california-r06-20261019
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/california-r06-20261019
          persist-credentials: true
      - name: Validate California research packet with standalone checker
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_state_return.py research/returns/R-06-CA --state CA --name California --counties 58 | tee /tmp/california-return-check.txt
      - name: Record checker output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("research/returns/R-06-CA/notes.md")
          content = path.read_text()
          text = Path("/tmp/california-return-check.txt").read_text()
          marker = "## Self-check output"
          path.write_text(content.split(marker, 1)[0] + marker + "\n\n\x60\x60\x60text\n" + text.rstrip() + "\n\x60\x60\x60\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/returns/R-06-CA/notes.md
          git diff --cached --quiet || (git commit -m "research(CA): record Python R-06 validation output" && git push origin HEAD:research/california-r06-20261019)
