name: Validate guide
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check public data synchronization
        run: |
          python3 scripts/build_public.py --check
          python3 scripts/build_public.py --test-fixtures
      - name: Check all states, county mappings, referral behavior and feedback links
        run: node tests/feedback.cjs
      - name: Check bingo report extraction regressions
        run: python3 tests/bingo_report.py
      - name: Check public data and sharing files
        run: python3 scripts/validate_public.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install UI test dependencies
        run: npm ci
      - name: Check unified caregiver flow
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check browser, mobile and print behavior
        run: npm run test:browser
