name: Validate guide
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check public data synchronization
        run: |
          python3 scripts/build_public.py --check
          python3 tests/mobility_routes.py
          python3 scripts/build_public.py --test-fixtures
      - name: Validate staged mobility law research
        run: |
          python3 scripts/validate_mobility_law_map.py
          python3 tests/mobility_law_map.py
      - name: Check all states, county mappings, referral behavior and feedback links
        run: node tests/feedback.cjs
      - name: Check Google ad measurement stays limited to ad visitors
        run: node tests/ads-measure.cjs
      - name: Check bingo report extraction regressions
        run: |
          python3 tests/bingo_report.py
          python3 tests/bingo_bugle.py
          python3 tests/freshness.py
          node tests/bingo.cjs
          node tests/facilities.cjs
      - name: Check public data and sharing files
        run: python3 scripts/validate_public.py
      - name: Keep Google AdSense on findbingo.org only (never on the guide, which runs Ad Grants)
        run: python3 tests/adsense_scope.py
      - name: Check country pages for veterans outside the U.S.
        run: python3 tests/world.py
      - name: Check the text-only, low-data country pages
        run: python3 tests/world_lite.py
      - name: Check the bad paper section
        run: python3 tests/bad_paper.py
      - name: Check the veterans in the justice system page
        run: python3 tests/justice.py
      - name: Check the resource-mining pipeline and its generated reports
        run: python3 tests/mining.py
      - name: Bingo pipeline (source registry, normalized CSV, merge checks)
        run: python3 tests/bingo_pipeline.py
      - name: Check link-check sorting, report wording and coverage
        run: python3 tests/link_check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install UI test dependencies
        run: npm ci
      - name: Check standalone Ohio Bingo Finder
        run: node tests/bingo-site.cjs
      - name: Check unified caregiver flow
        run: npm test
      - name: Check 13-state assistance navigator and role-sensitive routing
        run: node tests/assistant.mjs
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check browser, mobile and print behavior
        run: npm run test:browser
      - name: Check assistance navigator browser interactions
        run: node tests/assistant-browser.cjs
