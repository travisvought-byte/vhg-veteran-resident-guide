name: Build California public guide
on:
  push:
    branches:
      - publish/california-referral-20261019
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: publish/california-referral-20261019
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and capture California output
        shell: bash
        run: |
          set +e
          python -m pip install qrcode >/tmp/qr-install.txt 2>&1
          python3 scripts/build_public.py > /tmp/ca-build.txt 2>&1
          A=$?
          if [ "$A" -eq 0 ]; then
            python3 scripts/build_public.py --test-fixtures > /tmp/ca-fixtures.txt 2>&1
            B=$?
            python3 scripts/make_qr.py > /tmp/ca-qr.txt 2>&1
            C=$?
            python3 scripts/build_public.py --check > /tmp/ca-sync.txt 2>&1
            D=$?
            python3 scripts/validate_public.py > /tmp/ca-public.txt 2>&1
            E=$?
            node tests/feedback.cjs > /tmp/ca-feedback.txt 2>&1
            F=$?
          else
            B=99; C=99; D=99; E=99; F=99
          fi
          {
            echo "# California publication diagnostics"
            echo "build=$A fixtures=$B qr=$C sync=$D validate=$E feedback=$F"
            for x in /tmp/ca-build.txt /tmp/ca-fixtures.txt /tmp/ca-qr.txt /tmp/ca-sync.txt /tmp/ca-public.txt /tmp/ca-feedback.txt; do
              if [ -f "$x" ]; then echo "## $x"; cat "$x"; fi
            done
          } > research/returns/R-06-CA/publish-diagnostics.txt
          tail -90 research/returns/R-06-CA/publish-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/returns/R-06-CA/publish-diagnostics.txt
          git add index.html ca.html share.html share-ca.html assets data/public || true
          git diff --cached --quiet || (git commit -m "publish(CA): generate static California state edition and record checks" && git push origin HEAD:publish/california-referral-20261019)
          if [ "$A" -ne 0 ] || [ "$B" -ne 0 ] || [ "$C" -ne 0 ] || [ "$D" -ne 0 ] || [ "$E" -ne 0 ] || [ "$F" -ne 0 ]; then exit 1; fi
