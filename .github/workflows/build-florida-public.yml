name: Build Florida public guide
on:
  push:
    branches:
      - publish/florida-referral-20261019
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: publish/florida-referral-20261019
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate state pages and QR code
        run: |
          python -m pip install qrcode
          python3 scripts/build_public.py
          python3 scripts/make_qr.py
          python3 scripts/build_public.py --check
      - name: Validate public output
        run: |
          python3 scripts/validate_public.py
          node tests/feedback.cjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ data/public/ share*.html fl.html *.html
          git diff --cached --quiet || (git commit -m "publish(FL): build generated public edition, QR and sharing kit" && git push origin HEAD:publish/florida-referral-20261019)
