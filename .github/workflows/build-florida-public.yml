name: Build Florida public guide
on:
  push:
    branches:
      - publish/florida-referral-20261019
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: publish/florida-referral-20261019
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate state pages and QR code
        run: |
          python -m pip install qrcode
          python3 scripts/build_public.py
          python3 scripts/make_qr.py
          python3 scripts/build_public.py --check
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ data/public/ share*.html fl.html *.html
          git diff --cached --quiet || (git commit -m "publish(FL): build generated public edition, QR and sharing kit" && git push origin HEAD:publish/florida-referral-20261019)

      - name: Record validation diagnostics
        shell: bash
        run: |
          set +e
          python3 scripts/validate_public.py > /tmp/validate-public.txt 2>&1
          A=$?
          node tests/feedback.cjs > /tmp/feedback.txt 2>&1
          B=$?
          {
            echo "# Florida publication diagnostics"
            echo "validator exit: $A"
            echo "feedback exit: $B"
            echo "## validate_public"
            cat /tmp/validate-public.txt
            echo "## feedback"
            cat /tmp/feedback.txt
          } > research/returns/R-06-FL/publish-diagnostics.txt
          cat research/returns/R-06-FL/publish-diagnostics.txt
          git add research/returns/R-06-FL/publish-diagnostics.txt
          git diff --cached --quiet || (git commit -m "ci(FL): record integration validation diagnostics" && git push origin HEAD:publish/florida-referral-20261019)
          if [ "$A" -ne 0 ] || [ "$B" -ne 0 ]; then exit 1; fi
